name: fb_media_saver
description: "Descarga videos y fotos públicos de Facebook. Monetizado con AdMob de forma no invasiva."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Red / parsing
  http: ^1.2.0
  html: ^0.15.4                 # parseo de HTML del post público

  # Descarga y guardado
  dio: ^5.4.0                   # descargas con progreso y cancelación
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  device_info_plus: ^11.2.0     # detectar versión de Android para pedir el permiso correcto
  saver_gallery: ^3.0.6         # guardar en la galería (fotos/videos)
  open_filex: ^4.4.0

  # Login / contenido propio del usuario
  flutter_inappwebview: ^6.1.5  # webview para login de Facebook y captura de sesión

  # Estado y utilidades
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  share_plus: ^12.0.2
  url_launcher: ^6.2.5

  # Anuncios
  google_mobile_ads: ^5.1.0     # AdMob (banner + intersticial no invasivo)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Ícono y splash (ver README, sección "Ícono y splash"). Se corren a mano
  # con dart run; no afectan el build normal.
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/splash/

# Config de flutter_launcher_icons (dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1877F2"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Config de flutter_native_splash (dart run flutter_native_splash:create).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash_logo.png
  color_dark: "#0D1B2A"
  image_dark: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    color: "#FFFFFF"
    color_dark: "#0D1B2A"
  android: true
  ios: false
